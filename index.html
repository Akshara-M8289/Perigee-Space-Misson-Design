<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perigee: Space Mission Design Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EBF1;--pane:#F6F9FB;--pane2:#EAF0F5;--ink:#10203B;--mute:#46587A;--line:#8FA6C3;--grid:#D2DEE9;
  --acc:#C93F0B;--acc-ink:#FFFFFF;--ok:#0A6B5C;--warn:#8A5A00;--bad:#B0231B;
  --okbg:#D5EEE7;--warnbg:#F7E6BC;--badbg:#F6D3CF;--focus:#1559D6;--wingSi:#2C4A82;--wingGa:#C98A12;--earth:#2D6CB3;--moon:#9AA3AE;--mars:#B4562F;--sunc:#E5A100;
  --head:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08183F;--pane:#0E2759;--pane2:#12306D;--ink:#E9F0FF;--mute:#AEC0E6;--line:#4E70B8;--grid:#122F6A;
  --acc:#FF8F52;--acc-ink:#08183F;--ok:#74E3C6;--warn:#F6C85B;--bad:#FF9A93;
  --okbg:#0E4A52;--warnbg:#4A4116;--badbg:#5A2230;--focus:#8DB8FF;--wingSi:#5E86D6;--wingGa:#F0B83E;--earth:#4A8FDB;--moon:#B7BFCA;--mars:#D9764C;--sunc:#F6C85B;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08183F;--pane:#0E2759;--pane2:#12306D;--ink:#E9F0FF;--mute:#AEC0E6;--line:#4E70B8;--grid:#122F6A;
  --acc:#FF8F52;--acc-ink:#08183F;--ok:#74E3C6;--warn:#F6C85B;--bad:#FF9A93;
  --okbg:#0E4A52;--warnbg:#4A4116;--badbg:#5A2230;--focus:#8DB8FF;--wingSi:#5E86D6;--wingGa:#F0B83E;--earth:#4A8FDB;--moon:#B7BFCA;--mars:#D9764C;--sunc:#F6C85B;color-scheme:dark;}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--head);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-weight:800;font-stretch:122%;margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,4rem)}h2{font-size:1.25rem}h3{font-size:1rem;font-stretch:112%}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:14px clamp(12px,2.5vw,28px) 56px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 12px}
.brand{font-weight:800;font-stretch:125%;font-size:1.25rem;letter-spacing:.01em}
.brand small{display:block;font-weight:400;font-stretch:100%;font-size:.78rem;color:var(--mute);letter-spacing:0}
.top nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--pane);padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:600;min-height:40px}
.btn:hover{background:var(--pane2)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:800;padding:11px 20px;font-stretch:112%}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--pane);border:1px solid var(--line);border-radius:2px;padding:14px}
.card.tight{padding:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mute{color:var(--mute)}.small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.82rem;background:var(--pane2)}
.dot{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:.72rem;font-weight:800;flex:none}
/* lobby */
.lobby{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;min-height:70vh}
.lobby .hero{display:grid;gap:16px}
.lobby .lede{font-size:1.1rem;max-width:56ch}
.lobby .fig{border:1px solid var(--line);background:var(--pane);padding:6px}
.setup{display:grid;gap:12px}
.setup label{font-weight:700;display:block;margin-bottom:4px}
.setup input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--ink);border-radius:3px;background:var(--pane);min-height:42px}
.modes{display:grid;gap:10px}
.mode{display:grid;gap:2px;text-align:left;border:1px solid var(--ink);background:var(--pane);padding:12px 14px;border-radius:3px;cursor:pointer}
.mode:hover{background:var(--pane2)}
.mode b{font-stretch:112%;font-weight:800}
.mode[disabled]{opacity:.55;cursor:not-allowed}
.join{display:flex;gap:8px}.join input{text-transform:uppercase;font-family:var(--mono);letter-spacing:.2em;width:7.5em}
/* work */
.strip{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:baseline;border-bottom:2px solid var(--ink);padding:0 0 8px;margin-bottom:12px}
.strip h2{font-size:1.5rem}
.strip .meta{color:var(--mute);font-size:.9rem}
.strip .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.work{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:14px;align-items:start}
.figs{display:grid;gap:14px;position:sticky;top:10px}
.figs .card{padding:6px}
.main{display:grid;gap:14px;min-width:0}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meter{background:var(--pane);border:1px solid var(--line);padding:9px 11px;display:grid;gap:3px;border-radius:2px}
.meter .l{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem}
.meter .l span:last-child{font-family:var(--mono);font-weight:500;font-size:.72rem;padding:0 6px;border-radius:2px}
.meter .v{font-family:var(--mono);font-size:.95rem;font-weight:500}
.meter .c{font-size:.78rem;color:var(--mute);line-height:1.3}
.bar{position:relative;height:9px;background:var(--pane2);border:1px solid var(--line);margin:2px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.meter.warn .bar i{background:var(--warn)}.meter.bad .bar i{background:var(--bad)}
.meter.warn .l span:last-child{background:var(--warnbg);color:var(--warn)}.meter.bad .l span:last-child{background:var(--badbg);color:var(--bad)}.meter.ok .l span:last-child{background:var(--okbg);color:var(--ok)}
.kpis{display:flex;gap:8px 22px;flex-wrap:wrap;padding:2px 2px}
.kpi{display:grid}
.kpi b{font-family:var(--mono);font-size:1.25rem;font-weight:500}
.kpi span{font-size:.78rem;color:var(--mute)}
.tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tab{border:1px solid var(--line);border-bottom:none;background:var(--pane2);padding:9px 14px;cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center;border-radius:3px 3px 0 0;margin-right:3px}
.tab[aria-selected=true]{background:var(--pane);border-color:var(--ink);box-shadow:0 2px 0 var(--pane);margin-bottom:-2px}
.panel{display:grid;gap:18px;border-top:none;border-radius:0 2px 2px 2px}
.role{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--pane2);border-left:4px solid var(--acc)}
.role.locked{border-left-color:var(--mute)}
fieldset.ctl{border:0;margin:0;padding:0;min-width:0;display:grid;gap:18px}
fieldset.ctl[disabled]{opacity:.62}
.sec{display:grid;gap:7px}
.sec>h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.why{font-size:.86rem;color:var(--mute);max-width:78ch}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.opt{position:relative;text-align:left;display:grid;gap:3px;align-content:start;border:1px solid var(--line);background:var(--pane);padding:9px 11px 9px;border-radius:3px;cursor:pointer}
.opt:hover{background:var(--pane2)}
.opt b{font-weight:700;padding-right:18px}
.opt .st{font-family:var(--mono);font-size:.74rem;color:var(--mute)}
.opt .ds{font-size:.8rem;line-height:1.35}
.opt[aria-pressed=true]{border:2px solid var(--acc);background:var(--pane2);padding:8px 10px}
.opt[aria-pressed=true]::after{content:"✓";position:absolute;right:8px;top:6px;font-weight:800;color:var(--acc)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt .tagline{font-size:.76rem;font-weight:700}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sl label{font-weight:700}.sl output{font-family:var(--mono);font-weight:500}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--acc);height:28px}
.read{font-family:var(--mono);font-size:.8rem;background:var(--pane2);padding:6px 9px;border:1px dashed var(--line);line-height:1.5}
.goals{display:grid;gap:7px}
.goal{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:.9rem}
.goal .bar{margin:0}
.goal .bar i{background:var(--acc)}
.review ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
.review li{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:7px 9px;border-left:4px solid var(--line);background:var(--pane2);font-size:.9rem}
.review li.block{border-left-color:var(--bad);background:var(--badbg)}
.review li.bad{border-left-color:var(--bad)}
.review li.warn{border-left-color:var(--warn)}
.sev{font-weight:800;font-size:.76rem;white-space:nowrap}
.review li.block .sev,.review li.bad .sev{color:var(--bad)}.review li.warn .sev{color:var(--warn)}
.review .fix{grid-column:2;font-size:.82rem;color:var(--mute)}
.who{font-size:.74rem;border:1px solid var(--line);padding:0 6px;border-radius:999px;margin-left:6px;white-space:nowrap;font-weight:500;color:var(--mute)}
.clear{color:var(--ok);font-weight:700}
.launch{display:grid;gap:10px}
/* team bar */
.team{display:grid;gap:8px;margin-bottom:12px}
.team .top2{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--mono);font-size:1.5rem;letter-spacing:.2em;font-weight:500;border:2px solid var(--ink);padding:0 10px;background:var(--pane)}
.members{display:flex;gap:8px;flex-wrap:wrap}
.mem{display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--pane);padding:3px 9px 3px 4px;border-radius:999px;font-size:.84rem}
.notes{display:grid;gap:3px;font-size:.88rem}
.notes input{flex:1;min-width:180px;padding:6px 9px;border:1px solid var(--ink);border-radius:3px;background:var(--pane)}
.roletog{display:flex;gap:6px;flex-wrap:wrap}
.roletog button{border:1px solid var(--line);background:var(--pane);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.82rem}
.roletog button[aria-pressed=true]{background:var(--ink);color:var(--pane);border-color:var(--ink)}
.coach{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;margin-bottom:12px;border:1px solid var(--ink);background:var(--pane);padding:9px 12px}
.coach ol{margin:0;padding:0;list-style:none;display:flex;gap:6px 20px;flex-wrap:wrap;counter-reset:s}
.coach li{counter-increment:s;font-size:.9rem}
.coach li::before{content:counter(s) ". ";font-weight:800;font-family:var(--mono)}
/* fly / result */
.fly{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px;align-items:start}
.phases{display:flex;gap:6px;flex-wrap:wrap}
.phase{padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:.86rem;color:var(--mute)}
.phase.on{background:var(--ink);color:var(--pane);border-color:var(--ink);font-weight:700}
.phase.done{border-color:var(--ok);color:var(--ok)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:420px;overflow:auto}
.log li{padding:6px 10px;border-left:4px solid var(--line);background:var(--pane2);font-size:.92rem}
.log li.good{border-left-color:var(--ok)}.log li.bad{border-left-color:var(--bad);background:var(--badbg)}
.log .k{font-family:var(--mono);font-size:.74rem;color:var(--mute);margin-right:8px}
.res{display:grid;gap:14px}
.grade{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:center}
.grade .big{font-size:clamp(3.5rem,10vw,6.5rem);font-weight:800;font-stretch:125%;line-height:1;font-variant-numeric:tabular-nums}
.grade h1{font-size:clamp(1.6rem,4vw,2.6rem)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.sc{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.9rem;margin:5px 0}
.sc .bar{margin:0}.sc .bar i{background:var(--acc)}
.reqs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.reqs li{display:flex;gap:8px;font-size:.9rem}
.reqs .y{color:var(--ok);font-weight:800}.reqs .n{color:var(--bad);font-weight:800}
.less{display:grid;gap:10px}
.less .it{border-left:4px solid var(--acc);padding:2px 0 2px 12px}
.less .it b{display:block;font-stretch:110%}
.lb{width:100%;border-collapse:collapse;font-size:.88rem}
.lb th,.lb td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.lb th{font-weight:700}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,12,30,.62);display:none;align-items:flex-start;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;overflow:auto;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--pane);border:2px solid var(--ink);max-width:880px;width:100%;padding:18px;display:grid;gap:14px}
.sheet header{display:flex;gap:10px;align-items:center}.sheet header h2{margin-right:auto}
.hb{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.hb div{border-left:4px solid var(--acc);padding-left:10px}.hb b{display:block}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem;display:block;overflow-x:auto}
.tbl th,.tbl td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.sheet textarea{width:100%;min-height:70px;font-family:var(--mono);font-size:.74rem;padding:8px;background:var(--pane2);border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--pane);padding:9px 16px;border-radius:3px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
svg text{font-family:var(--mono)}
@media (max-width:980px){.work,.fly,.lobby,.cols{grid-template-columns:1fr}.figs{position:static;grid-template-columns:1fr 1fr}.meters{grid-template-columns:repeat(2,1fr)}.sc{grid-template-columns:110px 1fr 60px}}
@media (max-width:640px){.figs{grid-template-columns:1fr}.meters{grid-template-columns:1fr 1fr}.goal{grid-template-columns:1fr auto}.goal .bar{grid-column:1/-1}.grade{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Perigee<small>Space mission design studio</small></div>
    <nav aria-label="Tools">
      <button class="btn sm" data-act="handbook" type="button">Handbook</button>
      <button class="btn sm" data-act="library" type="button">Saved designs</button>
    </nav>
  </header>
  <main id="screen" aria-live="off"></main>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Details"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== PERIGEE · mission model (pure functions, no DOM) ===== */
const G0 = 9.80665;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = (x, d = 0) => (Math.abs(x) >= 1000 ? Math.round(x).toLocaleString("en-US") : (+x).toFixed(d));
function rnd(seed, m, k) {
  let t = (Math.imul(seed | 0, 2654435761) ^ Math.imul(m + 1, 40503) ^ Math.imul(k + 1, 9973)) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ---------- orbits ---------- */
const ORB = {
  leo: { n: "Low Earth orbit", alt: "500 km", tier: 1, ecl: .36, per: 1.6, cyc: 5400, rad: 2, dist: 1, con: .012, gap: .8, dvI: 0, dvY: 45, flux: 1361, cruise: 0, pass: 30, storm: .5, deb: .15, insR: 0, body: "earth",
    note: "Close to Earth, so pictures are sharp and launches are cheap. But the thin atmosphere drags the craft down, it spends over a third of each 96-minute lap in shadow, and a ground station only sees it for a few minutes a day." },
  sso: { n: "Sun-synchronous orbit", alt: "700 km, polar", tier: 2, ecl: .30, per: 1.65, cyc: 5300, rad: 5, dist: 1, con: .016, gap: .8, dvI: 0, dvY: 12, flux: 1361, cruise: 0, pass: 120, storm: .8, deb: .12, insR: 0, body: "earth",
    note: "A polar orbit tuned so the craft crosses each place at the same local time every day, which keeps shadows consistent. Great for Earth observation. A little higher means much less drag, but more radiation." },
  meo: { n: "Medium Earth orbit", alt: "20,000 km", tier: 3, ecl: .15, per: 12, cyc: 700, rad: 60, dist: .25, con: .08, gap: .4, dvI: 0, dvY: 6, flux: 1361, cruise: 0, pass: 600, storm: 1.2, deb: .03, insR: 0, body: "earth",
    note: "Navigation-satellite territory. Each satellite sees a big slice of Earth for hours, but this is the heart of the Van Allen radiation belts, which are brutal on electronics and solar cells." },
  geo: { n: "Geostationary orbit", alt: "35,786 km", tier: 4, ecl: .03, per: 24, cyc: 90, rad: 20, dist: .08, con: .9, gap: .1, dvI: 1500, dvY: 50, flux: 1361, cruise: 0, pass: 0, storm: 1.0, deb: .04, insR: .03, body: "earth",
    note: "One lap takes exactly a day, so the craft hovers over one spot and a single ground station can talk to it all the time. The price: a long way up, so signals are weak, and the craft must fire its own engine to circularize." },
  lun: { n: "Lunar orbit", alt: "100 km polar", tier: 5, ecl: .30, per: 2, cyc: 4000, rad: 6, dist: .01, con: .22, gap: .6, dvI: 900, dvY: 120, flux: 1361, cruise: .3, pass: 0, storm: 1.0, deb: .02, insR: .05, body: "moon",
    note: "Three days from Earth. The Moon’s lumpy gravity slowly tugs a low orbit out of shape, so you carry fuel to keep correcting. Earth is far away and sometimes behind the Moon, so contact is limited." },
  mar: { n: "Mars orbit", alt: "400 km", tier: 6, ecl: .30, per: 2.1, cyc: 3800, rad: 4, dist: .00035, con: .18, gap: 1.5, dvI: 1100, dvY: 15, flux: 590, cruise: 8, pass: 0, storm: 1.0, deb: .01, insR: .08, body: "mars",
    note: "An eight-month cruise, one chance to brake into orbit, sunlight less than half as strong as at Earth, and radio signals that crawl. Everything about the spacecraft has to work the first time." }
};

/* ---------- launch vehicles (wet mass deliverable, kg, to each injection) ---------- */
const LV = {
  rs: { n: "Carpool-9 rideshare", cost: 4, rel: .93, lead: 6, cap: { leo: 160, sso: 120 }, blurb: "A seat on someone else’s rocket. Cheap, but only to low orbit and only small." },
  kes: { n: "Kestrel small launcher", cost: 14, rel: .91, lead: 10, cap: { leo: 420, sso: 300 }, blurb: "A dedicated small rocket for small satellites." },
  her: { n: "Heron medium launcher", cost: 58, rel: .95, lead: 14, cap: { leo: 2600, sso: 1800, meo: 950, geo: 420, lun: 320 }, blurb: "The workhorse. Reaches the Moon with a small craft; too small for Mars." },
  con: { n: "Condor heavy launcher", cost: 150, rel: .965, lead: 20, cap: { leo: 9000, sso: 6200, meo: 4800, geo: 3000, lun: 2500, mar: 1700 }, blurb: "Goes anywhere in the game. Expensive, so it eats the budget." }
};

/* ---------- spacecraft parts ---------- */
const BUS = {

function goalQ(goal, list, acc, pcq) {

}

  const scCost = scSub * red.cm + instCost, itCost = scCost * .12, opsCost = gnd.cy * Ty;
  const cost = scCost + itCost + lv.cost + opsCost;
  const budget = sc.budget * df.bm;
  const reserve = (budget - cost) / budget;
  if (!sandbox && cost > budget) add("block", "lead", `Total cost is $${fmt(cost)}M but the budget is $${fmt(budget)}M.`, "Trim an instrument, shrink the bus, or pick a cheaper rocket.");

  // reliability
  const lam = (bus.risk + ad0.risk + pr.risk + cpu.risk + .02) * red.hz;
  const advN = [cell, bat, ad0, pr, cpu, ant, pc].filter(x => x.adv).length + insts.filter(i => i.adv).length;
  const relPred = (lv.rel + df.lvb) * Math.exp(-lam * Math.min(Ty, lifeM / 12));

  // science
  const fit = sc.fit[D.orb];
  const sci0 = sciOf(sc, insts, acc, pc.q);
  const dutyF = Math.pow(duty, .6);
  const S0 = sci0 * fit * dr.ret * dutyF;
  const goals = sc.goals.map(g => ({ n: g.n, w: g.w, crit: g.crit, q: goalQ(g, insts, acc, pc.q) }));

  // flags: serious / warning
  if (fit === 0) add("bad", "lead", `${o.n} cannot do this mission: ${sc.n} needs ${ORB[sc.sug].n.toLowerCase()}.`, "Mission Lead: choose the orbit the mission needs.");
  else if (fit < .6) add("warn", "lead", `${o.n} is a weak fit for this goal (${Math.round(fit * 100)}% as useful as the best orbit).`, "Mission Lead: consider " + ORB[sc.sug].n.toLowerCase() + ".");
  if (powM < 0) add("bad", "eng", `Power: the spacecraft needs ${fmt(load)} W but the array will only average ${fmt(GavgEOL)} W by end of life.`, "Engineer: bigger or better array · Science: drop a power-hungry instrument · Comms & Ops: lower duty cycle.");
  else if (powM < .05) add("warn", "eng", `Power margin is only ${Math.round(powM * 100)}%. Any surprise will cause brown-outs.`, "Engineer: a little more array.");
  if (batM < 1) add("bad", "eng", `Battery holds ${fmt(D.wh)} Wh but the craft needs about ${fmt(batReq)} Wh to ride through each ${ecH.toFixed(1)} h eclipse.`, "Engineer: more battery capacity, or Comms & Ops: lower duty cycle.");
  if (dr.proc > 0 && dr.ret < .5) add("bad", "com", `Only ${Math.round(dr.ret * 100)}% of the data can reach Earth: ${fmt(dr.proc, 1)} GB/day produced, about ${fmt(Math.min(dl, 99999), 1)} GB/day deliverable.`, "Comms & Ops: bigger antenna, more stations, compression · Science: fewer data-heavy instruments.");
  else if (dr.proc > 0 && dr.ret < .85) add("warn", "com", `About ${Math.round((1 - dr.ret) * 100)}% of the data will be lost (produced ${fmt(dr.proc, 1)} GB/day vs ${fmt(Math.min(dl, 99999), 1)} GB/day deliverable).`, "Comms & Ops: stronger link or on-board processing.");
  if (dr.need > 0 && D.sto < dr.need) add("warn", "com", `On-board storage (${D.sto} GB) is smaller than the ~${fmt(dr.need, 0)} GB that builds up between ground contacts.`, "Comms & Ops: more storage.");
  if (ant.pt < acc) add("warn", "eng", `${ant.n} needs pointing of ${ant.pt}° but the attitude system only holds ${acc}°, so the link loses ${Math.round((1 - pointF) * 100)}% of its rate.`, "Engineer: better pointing · Comms & Ops: lower-gain antenna.");
  const pointLoss = insts.filter(i => i.pt < acc);
  if (pointLoss.length) add("warn", "sci", `${pointLoss.map(i => i.n).join(", ")} ${pointLoss.length > 1 ? "need" : "needs"} steadier pointing than ${acc}°, so ${pointLoss.length > 1 ? "their" : "its"} data quality drops.`, "Engineer: upgrade attitude control · Science: swap the instrument.");
  for (const g of goals) if (g.crit && g.q < .6) add(g.q === 0 ? "bad" : "warn", "sci", `Critical goal “${g.n}” is only ${Math.round(g.q * 100)}% covered.`, "Science: add or swap an instrument that measures it.");
  if (radLifeY < Ty) add("bad", "eng", `Radiation will wear out the computer in about ${radLifeY.toFixed(1)} years, short of the ${Ty.toFixed(1)}-year goal.`, "Engineer: radiation-tolerant computer or more shielding.");
  if (propLifeY < Ty && pr.isp > 0) add("bad", "eng", `Fuel for station-keeping lasts ${Math.max(0, propLifeY).toFixed(1)} years, not ${Ty.toFixed(1)}.`, "Engineer: raise propellant margin or use a more efficient engine.");
  else if (pr.isp === 0 && o.pass && propLifeY < Ty) add("bad", "eng", `With no engine the orbit will decay in about ${propLifeY.toFixed(1)} years.`, "Engineer: add propulsion.");
  if (lifeM < T && !(radLifeY < Ty) && !(propLifeY < Ty)) add("bad", "eng", `Estimated life is ${(lifeM / 12).toFixed(1)} years, limited by ${lim[0]}. The goal is ${Ty.toFixed(1)}.`, "Engineer: address " + lim[0] + ".");
  if (cap > 0 && launchMass <= cap) {
    if (massM < .05) add("warn", "eng", `Only ${Math.round(massM * 100)}% mass margin on the rocket. Real teams keep 10% or more.`, "Trim mass.");
    else if (massM > .35) add("warn", "lead", `The rocket has ${Math.round(massM * 100)}% spare capacity. You are paying for lift you do not use.`, "Mission Lead: a smaller, cheaper rocket · Science: add instruments.");
  }
  if (!sandbox && cost <= budget && reserve < .05) add("warn", "lead", `Budget reserve is only ${Math.round(reserve * 100)}%. Costs usually grow during development.`, "Hold back a few percent.");
  if (slack >= 0 && slack < 3) add("warn", "lead", `Only ${slack.toFixed(1)} months of schedule slack. One supplier delay would miss the launch window.`, "Choose simpler or more mature parts.");
  if (D.red === "single" && ["geo", "meo", "lun", "mar"].includes(D.orb)) add("warn", "eng", "Single-string electronics this far from home: a single fault cannot be fixed.", "Engineer: cross-strap or add redundancy.");
  const crit = goals.filter(g => g.crit).length;

  return { sc, df, o, lv, bus, cell, bat, ad: ad0, pr, cpu, red, shd, ant, gnd, pc, insts, sandbox, duty, T, Ty,
    instM, instCost, dry, prop, launchMass, cap, massM, dvTot, dvLoad, propLifeY, G, Gavg0, GavgEOL, load, busLoad, instP, powM, degr, ecH, batReq, batM, batLifeY, powLifeY, radLifeY,
    acc, pointF, rate, contact, dl, dr, dataRet: dr.ret, devM, slack, cruiseM, transferM, lifeM, lim: lim[0], cost, scCost, itCost, opsCost, budget, reserve, lam, advN, relPred, fit, sci0, dutyF, S0, goals, flags: F, dctx, crit,
    blocked: F.some(f => f.sev === "block") };
}

/* ---------- flight simulation + scoring ---------- */
function band(x, lo, hi) { if (x < 0) return 0; if (x < lo) return x / lo; if (x <= hi) return 1; return Math.max(.5, 1 - (x - hi) / (hi * 3)); }

function simulate(D, A, seed, team) {
  const ev = A.df.ev * (A.sandbox ? .3 : 1), o = A.o, T = A.T;
  const log = []; let cum = 0, ops = 0, fail = null, launchOk = true, slip = 0, missed = false;
  const L = (m, kind, text) => log.push({ m, kind, text, sci: cum, ph: curPh });
  let curPh = "Build";
  L(0, "info", `Design frozen: ${A.bus.n}, ${A.lv.n}, ${A.o.n.toLowerCase()}. Estimated build time ${fmt(A.devM)} months; launch window closes in ${A.sc.win >= 999 ? "—" : A.sc.win}.`);
  const pSlip = A.df === DF.learn ? .15 : A.df === DF.chief ? .6 : .35;
  if (!A.sandbox && rnd(seed, 0, 0) < pSlip) {
    slip = 1 + Math.floor(rnd(seed, 0, 1) * 3);
    if (A.slack < slip) { missed = true; L(Math.round(A.devM), "bad", `A supplier slipped ${slip} months. With only ${Math.max(0, A.slack).toFixed(1)} months of slack, the team misses the launch window and waits for the next one.`); }
    else L(Math.round(A.devM), "good", `A supplier slipped ${slip} months, but ${A.slack.toFixed(1)} months of schedule slack absorbed it.`);
  }
  curPh = "Launch";
  const pL = A.lv.rel + A.df.lvb;
  if (rnd(seed, 0, 2) >= pL) {
    launchOk = false; fail = { cause: "Launch failure", why: `${A.lv.n} has a ${Math.round(pL * 100)}% success rate, and this flight fell in the other ${Math.round((1 - pL) * 100)}%. No spacecraft design can remove launch risk; it can only be bought down with a more proven rocket.` };
    L(0, "bad", `Liftoff. Ninety seconds in, ${A.lv.n} suffers an anomaly and the mission is lost.`);
    return finish();
  }
  L(0, "good", `Liftoff on ${A.lv.n}. The spacecraft separates healthy.`);
  curPh = "Cruise";
  if (A.cruiseM > .5) L(0, "info", A.transferM > 0 ? `${Math.round(A.cruiseM)} months of gentle thrusting to climb to the final orbit.` : `${Math.round(A.cruiseM)}-month cruise toward the destination.`);
  if (o.dvI > 0) {
    const pI = o.insR * (A.pr.isp > 400 ? .6 : 1) * ev;
    if (rnd(seed, 0, 3) < pI) { fail = { cause: "Orbit insertion failure", why: `Putting a spacecraft into ${o.n.toLowerCase()} takes one big burn (${fmt(o.dvI)} m/s) and carries about ${Math.round(o.insR * 100)}% risk on this class of mission.` }; L(Math.round(A.cruiseM), "bad", "The braking burn does not go as planned. The spacecraft misses its orbit."); return finish(); }
    L(Math.round(A.cruiseM), "good", `Insertion burn complete. The spacecraft is in ${o.n.toLowerCase()}.`);
  }
  curPh = "Commission";
  const pC = (.01 + .015 * A.advN) * ev;
  if (rnd(seed, 0, 4) < pC) { fail = { cause: "Commissioning anomaly", why: `Your design uses ${A.advN} advanced part${A.advN === 1 ? "" : "s"}. New technology has little flight history, and a bug in the first weeks is the most common way it shows.` }; L(Math.round(A.cruiseM) + 1, "bad", "During checkout a power switch latches. The spacecraft never leaves safe mode."); return finish(); }
  L(Math.round(A.cruiseM) + 1, "good", "Commissioning complete. Instruments open their covers.");
  curPh = "Operate";
  let alive = A.insts.slice(), acc = A.acc, stormMod = 1;
  const t0 = Math.round(A.cruiseM) + 1;
  const sys = ["flight computer", "attitude control", "propulsion system", "main structure", "power and radio electronics"];
  const w = [A.cpu.risk, A.ad.risk, A.pr.risk, A.bus.risk, .02];
  const ws = w.reduce((a, b) => a + b, 0);
  for (let m = 1; m <= T; m++) {
    const tm = t0 + m; let mod = 1, note = null;
    if (m > A.lifeM) { fail = { cause: "End of life: " + A.lim, why: `The design was only built to last ${(A.lifeM / 12).toFixed(1)} years, limited by ${A.lim}.`, soft: 1 }; L(tm, "bad", `Month ${m}: end of life. ${A.lim[0].toUpperCase() + A.lim.slice(1)} finally limits the mission.`); break; }
    const pm = 1 - Math.exp(-A.lam / 12 * ev * (1 + Math.max(0, 1 - A.batM) * 1.5));
    if (rnd(seed, m, 1) < pm) {
      let x = rnd(seed, m, 2) * ws, k = 0; while (k < 4 && x > w[k]) { x -= w[k]; k++; }
      fail = { cause: "Spacecraft failure: " + sys[k], why: `Every part has some chance of failing each year. Together yours add up to roughly ${(A.lam * 100).toFixed(0)}% a year${A.red.hz === 1 ? ", and with single-string electronics any one failure is fatal. Redundancy would have cut that by 40–70%" : ""}.` };
      L(tm, "bad", `Month ${m}: the ${sys[k]} fails and cannot be recovered.`); break;
    }
    if (rnd(seed, m, 3) < o.storm / 12 * ev) {
      if (A.cpu.tol < 80) {
        mod *= .5;
        if (rnd(seed, m, 4) < .25 / A.shd.k) { fail = { cause: "Solar storm destroyed the computer", why: `A flare sent a stream of charged particles through a computer rated for only ${A.cpu.tol} krad. ${A.shd.k > 1 ? "Your shielding helped but was not enough." : "Shielding or a radiation-tolerant computer would have saved it."}` }; L(tm, "bad", `Month ${m}: a solar storm latches up the flight computer for good.`); break; }
        note = [`Month ${m}: a solar storm resets the computer. Science is halved this month.`, "bad"];
      } else if (A.powM < .15) { mod *= .7; note = [`Month ${m}: a solar storm dims the arrays; with so little power margin, instruments are throttled.`, "bad"]; }
      else note = [`Month ${m}: a solar storm hits. Your ${A.cpu.n.toLowerCase()} and power margin ride it out.`, "good"];
    }
    if (A.ad.acc <= .1 && rnd(seed, m, 5) < .3 / 12 * ev) {
      if (A.red.hz === 1 && rnd(seed, m, 6) < .5) { acc = Math.max(acc, 2); note = [`Month ${m}: a reaction wheel seizes. With no spare, fine pointing is gone for good.`, "bad"]; }
      else note = [`Month ${m}: a reaction wheel shows a fault. The spare path takes over.`, "good"];
    }
    if (rnd(seed, m, 7) < o.deb / 12 * ev) {
      if (rnd(seed, m, 8) < .35 / Math.sqrt(A.shd.k)) { fail = { cause: "Debris impact", why: `${A.o.n} has ${(o.deb * 100).toFixed(0)}% a year chance of a damaging strike. ${A.shd.k > 1 ? "Even your shielding could not stop this one." : "Shielding makes it much more survivable."}` }; L(tm, "bad", `Month ${m}: a piece of debris punches through the spacecraft.`); break; }
      note = [`Month ${m}: a small fragment hits the craft but does no serious harm.`, "good"];
    }
    let dataMod = 1;
    if (rnd(seed, m, 9) < .8 / 12 * ev) {
      dataMod = A.gnd.cnt >= 3 ? .95 : .6;
      note = [`Month ${m}: ground station outage. ${A.gnd.cnt >= 3 ? "Other stations pick up the passes." : "With a single station, a third of the data is delayed."}`, A.gnd.cnt >= 3 ? "good" : "bad"];
    }
    for (let i = alive.length - 1; i >= 0; i--) if (rnd(seed, m, 20 + i) < alive[i].risk / 12 * ev) { L(tm, "bad", `Month ${m}: the ${alive[i].n.toLowerCase()} fails.`); alive.splice(i, 1); }
    if (note) L(tm, note[1], note[0]);
    if (!alive.length) { fail = { cause: "All instruments lost", why: "Every science instrument failed. Carrying a second instrument for key goals gives a fallback." }; L(tm, "bad", `Month ${m}: no working instruments remain.`); break; }
    const pUp = clamp(A.Gavg0 * Math.max(0, 1 - A.degr * m / 12) / A.load, 0, 1);
    const battF = A.batM >= 1 ? 1 : .4 + .6 * A.batM;
    const dd = dataRetOf(alive, A.dctx).ret * dataMod;
    const s = sciOf(A.sc, alive, acc, A.pc.q) * A.fit * Math.min(1, dd) * A.dutyF * pUp * battF * mod;
    cum += s / T; ops = m;
    if (m === 1 || m % 12 === 0 || m === T) L(tm, "info", `Month ${m}: ${Math.round(cum * 100)}% of the mission’s science value delivered so far.`);
  }
  if (!fail && ops === T) L(t0 + T, "good", `Month ${T}: the primary mission is complete. ${A.lifeM > T * 1.3 ? "The spacecraft is still healthy; an extended mission is possible." : "Margins are used up; the team signs off."}`);
  return finish();

  function finish() {
    const sci = launchOk ? cum : 0;
    const monthsOps = launchOk ? ops : 0;
    const sSci = 40 * sci;
    const sSurv = launchOk ? 20 * Math.min(1, monthsOps / T) : 0;
    const rs = A.reserve; const sbx = A.sandbox;
    const eff = 15 * ((band(sbx ? .15 : rs, .08, .25) + band(A.massM, .06, .20) + band(A.powM, .08, .40) + Math.min(1, A.dataRet / .9)) / 4);
    const reqs = [
      ["Stays within budget", sbx || A.cost <= A.budget],
      ["Rocket can deliver it to the right orbit", A.cap > 0 && A.launchMass <= A.cap && A.fit > 0],
      [`Designed to last ${A.Ty.toFixed(1)} years`, A.lifeM >= T],
      ["Covers every critical science goal well (60%+)", A.goals.filter(g => g.crit).every(g => g.q >= .6)],
      ["Brings at least 80% of its data home", A.dataRet >= .8],
      ["Launches on schedule", !missed && A.slack >= 0]
    ];
    const sReq = 15 * reqs.filter(r => r[1]).length / reqs.length;
    const nBad = A.flags.filter(f => f.sev === "bad").length, nWarn = A.flags.filter(f => f.sev === "warn").length;
    const integ = 1 - Math.min(1, (nBad * 1.5 + nWarn) / 5);
    let tf = null, sCol;
    if (team && team.members > 1) { tf = team.signed / team.members; sCol = 10 * (.5 * tf + .5 * integ); } else sCol = 10 * integ;
    const total = Math.round(sSci + sSurv + eff + sReq + sCol);
    const grade = total >= 85 ? "Flawless flight" : total >= 70 ? "Mission success" : total >= 50 ? "Partial success" : total >= 30 ? "Limping home" : "Mission lost";
    return { log, launchOk, fail, science: sci, monthsOps, T, slip, missed, reqs, nBad, nWarn, integ, tf, scores: { sci: sSci, surv: sSurv, eff, req: sReq, col: sCol, total }, grade, completed: !fail && ops === T };
  }
}

/* ---------- coaching ---------- */
function lessons(D, A, R) {
  const out = [];
  const P = (pts, title, body) => out.push({ pts, title, body });
  if (R.fail && R.fail.cause === "Launch failure") P(20, "Launch risk is real", R.fail.why + " Rerolling the dice (same design, new seed) will usually give a different result. A more reliable rocket costs more, so the trade is between budget and risk.");
  else if (R.fail) P(40 * (1 - R.monthsOps / R.T) * .5 + 10, R.fail.cause, R.fail.why);
  if (A.dataRet < .85 && A.dr.proc > 0) {
    const lim = A.dl < A.dr.proc ? `Your link delivers about ${fmt(A.dl, 1)} GB/day but the instruments make ${fmt(A.dr.proc, 1)} GB/day after processing.` : `Storage of ${A.dctx.sto} GB is smaller than the ${fmt(A.dr.need, 0)} GB that piles up between contacts.`;
    P(40 * (1 - A.dataRet) * A.sci0 * A.fit, "Data is the bottleneck", lim + " Throughput = antenna rate × distance loss × how long a ground station can see you. Fix the weakest link: a stronger antenna, a bigger ground network, on-board compression, or fewer data-hungry instruments.");
  }
  if (A.powM < .05 || A.batM < 1) P(12, "Power was tight", `The array averages ${fmt(A.GavgEOL)} W by end of life against ${fmt(A.load)} W of demand, and the battery covers ${Math.round(Math.min(A.batM, 9) * 100)}% of what each ${A.ecH.toFixed(1)}-hour eclipse needs. When power runs short the spacecraft switches instruments off. Instruments cost power; power costs array area, which costs mass and money.`);
  if (A.fit < .6) P(40 * (1 - A.fit), "Wrong orbit for the job", `${A.o.n} is only ${Math.round(A.fit * 100)}% as useful for ${A.sc.n}. ${A.o.note}`);
  const unc = A.goals.filter(g => g.q < .6).sort((a, b) => b.w - a.w)[0];
  if (unc) P(40 * unc.w / 100 * (1 - unc.q) * A.fit, `“${unc.n}” was poorly covered`, `That goal is worth ${unc.w}% of the science. Its instrument must be suited to the measurement, and steady enough: instruments degrade when pointing is coarser than they need (currently ${A.acc}°).`);
  if (A.lifeM < A.T) P(10 * (1 - A.lifeM / A.T), "The design would not last", `Estimated life was ${(A.lifeM / 12).toFixed(1)} years, limited by ${A.lim}, but the goal was ${A.Ty.toFixed(1)} years. Radiation, fuel, battery wear and solar-cell ageing each set a clock; the shortest one wins.`);
  if (A.massM > .35) P(4, "Too much rocket", `You used only ${Math.round((1 - A.massM) * 100)}% of the launcher’s capacity. A smaller rocket would have saved money for instruments or reserve.`);
  if (!A.sandbox && A.reserve < .05 && A.reserve >= 0) P(4, "No cushion", "A budget with almost no reserve cannot absorb the cost growth that nearly every real mission sees.");
  if (A.red.hz === 1 && R.fail && /failure/.test(R.fail.cause)) P(8, "A single point of failure", "Cross-strapped or redundant electronics cost 6–14% more mass but cut random failures by 40–70%.");
  if (R.missed) P(6, "Schedule slack saved nothing", "Your design left too little schedule slack. Simpler, more mature parts shorten development and make the launch window safer.");
  if (R.tf !== null && R.tf < 1) P(5 * (1 - R.tf), "Not everyone signed off", "The team launched before every member approved the design. Integration reviews catch the problems nobody owns alone.");
  if (!out.length) P(1, "Clean flight", "No major shortfalls. To push the score further, look for the cheapest way to add science or shed mass.");
  return out.sort((a, b) => b.pts - a.pts).slice(0, 4);
}

function reportText(D, A, R, who) {
  const L = [];
  L.push(`# Mission report: ${A.sc.n}`, ``, `Crew: ${who}`, `Outcome: **${R.grade}** (${R.scores.total}/100)`, ``);
  L.push(`## Design`, `- Orbit: ${A.o.n} (${A.o.alt})`, `- Launch vehicle: ${A.lv.n}, ${fmt(A.launchMass)} kg of ${fmt(A.cap)} kg capacity`, `- Spacecraft: ${A.bus.n}, ${(+D.area).toFixed(1)} m² ${A.cell.n}, ${fmt(D.wh)} Wh battery, ${A.ad.n}, ${A.pr.n}`, `- Instruments: ${A.insts.map(i => i.n).join(", ")}`, `- Comms: ${A.ant.n} with ${A.gnd.n}; ${A.pc.n}; ${D.sto} GB storage; ${D.duty}% duty cycle`, `- Cost: $${fmt(A.cost)}M of $${A.sandbox ? "unlimited" : fmt(A.budget) + "M"}`, `- Power: ${fmt(A.load)} W demand vs ${fmt(A.GavgEOL)} W end-of-life average`, `- Data: ${fmt(A.dr.proc, 1)} GB/day produced, ${fmt(A.dl, 1)} GB/day deliverable (${Math.round(A.dataRet * 100)}% returned)`, `- Estimated life: ${(A.lifeM / 12).toFixed(1)} years (limited by ${A.lim})`, ``);
  L.push(`## Score`, `- Science: ${R.scores.sci.toFixed(1)}/40`, `- Survival: ${R.scores.surv.toFixed(1)}/20`, `- Resource efficiency: ${R.scores.eff.toFixed(1)}/15`, `- Requirements: ${R.scores.req.toFixed(1)}/15`, `- Integration & teamwork: ${R.scores.col.toFixed(1)}/10`, ``);
  L.push(`## Flight log`, ...R.log.map(l => `- ${l.text}`), ``);
  L.push(`## What to learn from this`, ...lessons(D, A, R).map(x => `- **${x.title}.** ${x.body}`));
  return L.join("\n");
}

if (typeof module !== "undefined") module.exports = { ORB, LV, BUS, CELL, BAT, ADCS, PROP, CPU, RED, SHD, ANT, GND, PROC, STO, INST, SC, DF, DEFAULTS, STARTERS, analyze, simulate, lessons, reportText, flatten, cleanGroup, rnd, fmt };

<script>
"use strict";
const $ = (s, e = document) => e.querySelector(s), $$ = (s, e = document) => [...e.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ROLES = {
  lead: { n: "Mission Lead", s: "Mission", d: "Sets the objective, orbit and rocket, and guards the budget." },
  eng: { n: "Spacecraft Engineer", s: "Spacecraft", d: "Builds the craft: power, pointing, propulsion, computer and protection." },

const RK = ["lead", "eng", "sci", "com"];
const PAL = ["#C9400C", "#128A7C", "#3465A8", "#B58500", "#7C4DCC", "#C2406F"];
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };

function craftSVG(D, A, big) {

  if (!sbx && !S.last.logged) { S.last.logged = true; const all = ls.get("perigee.lb", []); all.push({ n: S.last.by || S.name || "Player", sc: D.sc, score: s.total, g: R.grade, team: !!(tm && tm.members > 1), t: Date.now() }); ls.set("perigee.lb", all.sort((a, b) => b.score - a.score).slice(0, 40)); }
  const lb2 = ls.get("perigee.lb", []).filter(x => x.sc === D.sc).sort((a, b) => b.score - a.score).slice(0, 5);
  $("#screen").innerHTML = `<div class="res"><div class="strip"><h2>${esc(A.sc.n)}: mission report</h2><span class="meta">${esc(A.o.n)} · ${esc(A.lv.n)}${S.last.by ? " · launched by " + esc(S.last.by) : ""}</span></div>
  <div class="card grade"><div class="big">${s.total}</div><div><h1>${R.grade}</h1><p class="mute">${R.completed ? `The spacecraft completed all ${R.T} months of its primary mission.` : R.fail ? `${esc(R.fail.cause)}${R.launchOk ? ` after ${R.monthsOps} of ${R.T} planned months.` : "."}` : ""} ${sbx ? "Sandbox flights are not ranked." : ""}</p></div></div>
  <div class="cols"><div class="card"><h3>Score</h3>${bars.map(([n, v, m]) => `<div class="sc"><span>${n}</span><div class="bar" aria-hidden="true"><i style="width:${v / m * 100}%"></i></div><span class="mono">${v.toFixed(1)}/${m}</span></div>`).join("")}
  <h3 style="margin-top:14px">Requirements</h3><ul class="reqs">${R.reqs.map(([n, y]) => `<li><span class="${y ? "y" : "n"}">${y ? "✓ Met" : "✗ Missed"}</span><span>${esc(n)}</span></li>`).join("")}</ul></div>
  <div class="card"><h3>What to learn from this flight</h3><div class="less" style="margin-top:8px">${less.map(x => `<div class="it"><b>${esc(x.title)}</b><span class="small">${esc(x.body)}</span></div>`).join("")}</div></div></div>
  <div class="cols"><div class="card"><h3>Flight log</h3><ul class="log" style="margin-top:8px">${R.log.map(l => `<li class="${l.kind}"><span class="k">${l.m ? "mo " + l.m : "start"}</span>${esc(l.text)}</li>`).join("")}</ul></div>
  <div class="card"><h3>Rankings for this mission (this browser)</h3>${sbx ? `<p class="small mute" style="margin-top:6px">Sandbox flights are not ranked.</p>` : `<table class="lb" style="margin-top:6px"><thead><tr><th>#</th><th>Crew</th><th>Score</th><th>Result</th></tr></thead><tbody>${lb2.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.n)}${x.team ? " (team)" : ""}</td><td class="mono">${x.score}</td><td>${esc(x.g)}</td></tr>`).join("")}</tbody></table>`}
  <p class="small mute" style="margin-top:10px">Rankings are kept only in this browser.</p></div></div>
  <div class="row"><button class="btn pri" type="button" data-act="back">Improve the design</button><button class="btn" type="button" data-act="again">Fly again with new dice</button><button class="btn" type="button" data-act="download">Download report</button><button class="btn" type="button" data-act="savelib2">Save this design</button></div></div>`;
  setOrbitGeom(D);
}
/* ---------- modals ---------- */
function modal(html) { const m = $("#modal"); m.innerHTML = `<div class="sheet">${html}</div>`; m.classList.add("on"); const b = $("[data-act=close]", m); if (b) b.focus(); }
function closeModal() { $("#modal").classList.remove("on"); $("#modal").innerHTML = ""; }
function handbook() {
  const H = [["Orbit altitude", "Low orbits give sharper pictures and cost less to reach, but air drag pulls the craft down and a ground station sees it for only minutes. High orbits see more at once but need more energy to reach and signals get weaker."], ["Eclipse and batteries", "In low orbit the craft slips into Earth’s shadow every 90 minutes. Solar arrays stop, so batteries must carry the load, and charging that often wears them out."], ["Payload capacity", "A rocket delivers only so many kilograms to each orbit. Fuel is mass, and carrying fuel needs more fuel: the rocket equation. This is why every kilogram matters."], ["Power", "Watts come from array area × cell efficiency × sunlight. Every instrument and computer draws power, so adding one means bigger arrays, which weigh more and cost more."], ["Data rate and contact time", "Downlink per day = antenna rate × distance loss × minutes in contact. A craft that makes more data than it can send wastes the difference."], ["Radiation", "Charged particles age solar cells and crash computers. Medium Earth orbit sits inside the radiation belts. Tougher chips and shielding buy lifetime."], ["Pointing", "A dish or telescope has to aim precisely. Steadier pointing costs mass, power and money, but without it instruments blur and links slow down."], ["Redundancy", "Spare parts cut failures but cost mass and money. Far from home, nobody can fix a failure, so careful teams carry more backups."], ["Margins", "Real teams keep 10–30% spare on mass, power and budget, because designs grow. The score rewards sensible reserves, and penalizes both too little and too much."]];
  modal(`<header><h2>Mission handbook</h2><button class="btn sm" type="button" data-act="close">Close</button></header><p class="mute">Nine ideas that explain almost every result in this game. Each tab in the workspace has a short “why it matters” line under every choice.</p><div class="hb">${H.map(([t, b]) => `<div><b>${t}</b><span class="small">${b}</span></div>`).join("")}</div><p class="small mute">Scoring: Science 40 · Survival 20 · Resource efficiency 15 · Requirements 15 · Integration and teamwork 10.</p>`);
}
function library() {
  const lib = ls.get("perigee.lib", []), cur = curD(), cols = [["Current design", cur, null], ...lib.map(x => [x.name, decode(x.code), x])].filter(c => c[1]);
  const rows = [["Mission", A => A.sc.n], ["Orbit", A => A.o.n], ["Rocket", A => A.lv.n], ["Instruments", A => A.insts.length], ["Cost ($M)", A => fmt(A.cost)], ["Launch mass (kg)", A => fmt(A.launchMass)], ["Estimated life (yr)", A => (A.lifeM / 12).toFixed(1)], ["Science potential", A => Math.round(A.S0 * 100) + "%"], ["Data returned", A => Math.round(A.dataRet * 100) + "%"], ["Predicted survival", A => Math.round(A.relPred * 100) + "%"], ["Blocking issues", A => A.flags.filter(f => f.sev === "block").length]];
  const An = cols.map(c => analyze(c[1]));
  modal(`<header><h2>Saved designs</h2><button class="btn sm" type="button" data-act="close">Close</button></header>
  <p class="small mute">Save designs in this browser and compare them side by side. Share one by copying its design code.</p>
  <table class="tbl"><thead><tr><th></th>${cols.map(c => `<th>${esc(c[0])}</th>`).join("")}</tr></thead><tbody>${rows.map(([n, f]) => `<tr><th>${n}</th>${An.map(A => `<td class="mono">${esc(f(A))}</td>`).join("")}</tr>`).join("")}<tr><th>Best score</th>${cols.map(c => `<td class="mono">${c[2] && c[2].score != null ? c[2].score : "—"}</td>`).join("")}</tr><tr><th></th>${cols.map(c => `<td>${c[2] ? `<button class="btn sm" type="button" data-act="loadlib" data-id="${c[2].id}">Load</button> <button class="btn sm" type="button" data-act="dellib" data-id="${c[2].id}">Delete</button>` : ""}</td>`).join("")}</tr></tbody></table>
  <div class="row"><button class="btn" type="button" data-act="savelib">Save current design</button></div>
  <div><label for="dc"><b>Load from a design code</b></label><textarea id="dc" placeholder="Paste a code that starts with PG1."></textarea><div class="row" style="margin-top:6px"><button class="btn" type="button" data-act="loadcode">Load code</button></div></div>`);
}
function codeModal() {
  const c = encode(curD());
  modal(`<header><h2>Design code</h2><button class="btn sm" type="button" data-act="close">Close</button></header><p class="small mute">Send this code to anyone. They can paste it under “Saved designs” to load your exact design.</p><textarea id="cc" readonly>${esc(c)}</textarea><div class="row"><button class="btn" type="button" data-act="copycc">Copy</button></div>`);
  $("#cc").addEventListener("focus", e => e.target.select());
}
function saveLib(score) {
  const D = curD(), lib = ls.get("perigee.lib", []);
  if (lib.length >= 6) { toast("You can keep six saved designs. Delete one first."); return; }
  lib.push({ id: String(Date.now()), name: `${SC[D.sc].n} #${lib.length + 1}`, code: encode(D), score: score == null ? null : score });
  toast(ls.set("perigee.lib", lib) ? "Design saved in this browser." : "This browser blocked saving.");
}
/* ---------- actions ---------- */
function act(a, b) {
  switch (a) {
    case "solo": nameFromInput(); S.mode = "solo"; S.roles = RK.slice(); G = freshG(); S.screen = "work"; S.tab = "lead"; renderAll(); break;
    case "team-new": nameFromInput(); enterTeam(newCode()); break;
    case "team-join": { nameFromInput(); const c = ($("#jc").value || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c.length !== 4) { toast("Enter the four-letter room code."); break; } enterTeam(c); break; }
    case "leave": leaveTeam(); break;
    case "back-lobby": S.screen = "lobby"; renderAll(); break;
    case "tab": S.tab = b.dataset.r; renderPanel(); break;
    case "role": { const r = b.dataset.r, i = S.roles.indexOf(r); if (i >= 0) S.roles.splice(i, 1); else S.roles.push(r); S.rolesSet = true; if (!S.roles.includes(S.tab) && S.roles.length) S.tab = S.roles[0]; pub(); renderPanel(); break; }
    case "inst": toggleInst(b.dataset.id); break;
    case "starter": if (!can("lead")) { toast("The Mission Lead sets the baseline."); break; } loadStarter(); break;
    case "sign": { const h = hashD(curD()); S.signed = S.signed === h ? "" : h; pub(); renderLive(); break; }
    case "launch": { const A = getA(); if (A.blocked) break; const D = curD(), tm = S.mode === "team" ? { members: Math.max(1, viewers().length), signed: viewers().filter(p => p.presence && p.presence.sg === hashD(D)).length } : null; const snap = { t: Date.now(), s: G.x.v.sd, d: D, tm: tm ? [tm.members, tm.signed] : null }; if (S.room) { S.myL = snap; pub(); } startFlight(snap, S.mode === "team" ? S.name : null); break; }
    case "reroll": G.x = { t: Date.now(), v: { sd: 1 + Math.floor(Math.random() * 99999) } }; pub(); renderLive(); toast("New dice rolled."); break;
    case "skip": clearInterval(flyTimer); S.screen = "result"; renderResult(); break;
    case "back": S.screen = "work"; renderAll(); break;
    case "again": G.x = { t: Date.now(), v: { sd: 1 + Math.floor(Math.random() * 99999) } }; pub(); S.screen = "work"; renderAll(); $('[data-act="launch"]') && act("launch"); break;
    case "download": downloadReport(); break;
    case "handbook": handbook(); break;
    case "library": library(); break;
    case "close": closeModal(); break;
    case "code": codeModal(); break;
    case "copycc": copyText($("#cc").value); break;
    case "copyroom": copyText(`Join my Perigee mission team: open this page, choose “Join a team” and enter room code ${S.code}.`); break;
    case "savelib": saveLib(null); if ($("#modal").classList.contains("on")) library(); break;
    case "savelib2": saveLib(S.last.R.scores.total); break;
    case "loadlib": { const x = ls.get("perigee.lib", []).find(i => i.id === b.dataset.id); const D = x && decode(x.code); if (D) { loadDesign(D); closeModal(); } break; }
    case "dellib": ls.set("perigee.lib", ls.get("perigee.lib", []).filter(i => i.id !== b.dataset.id)); library(); break;
    case "loadcode": { const D = decode($("#dc").value); if (!D) { toast("That code didn’t load. Check it starts with PG1."); break; } loadDesign(D); closeModal(); break; }
    case "coachx": S.coach = false; renderLive(); break;
    case "note": { const i = $("#note"); S.note = i.value.slice(0, 140); S.noteT = Date.now(); i.value = ""; pub(); renderLive(); break; }
  }
}
function copyText(t) { try { navigator.clipboard.writeText(t).then(() => toast("Copied."), () => toast("Select the text and copy it manually.")); } catch (e) { toast("Select the text and copy it manually."); } }
async function downloadReport() {
  const { D, A, R } = S.last, text = reportText(D, A, R, S.mode === "team" ? viewers().map(pname).join(", ") : (S.name || "Solo crew"));
  try { const dl = typeof claude !== "undefined" ? await claude.use("downloads") : null; if (!dl) throw 0; await dl.save({ filename: "perigee-mission-report.md", data: text }); toast("Report saved."); }
  catch (e) { modal(`<header><h2>Mission report</h2><button class="btn sm" type="button" data-act="close">Close</button></header><textarea id="cc" readonly style="min-height:300px">${esc(text)}</textarea><div class="row"><button class="btn" type="button" data-act="copycc">Copy</button></div>`); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],button[data-k]"); if (!b || b.disabled) return;
  if (b.dataset.act) act(b.dataset.act, b); else setVal(b.dataset.k, b.dataset.v);
});
document.addEventListener("input", e => { const t = e.target; if (t.type === "range" && t.dataset.k) { const v = +t.value; setVal(t.dataset.k, v, true); const o = $(`[data-out="${t.dataset.k}"]`); if (o) o.textContent = outText(t.dataset.k, v); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); if (e.key === "Enter" && e.target.id === "note") act("note"); if (e.key === "Enter" && e.target.id === "jc") act("team-join"); });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
requestAnimationFrame(satLoop);
renderAll();
</script>
